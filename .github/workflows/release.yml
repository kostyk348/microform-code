name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NAME="microform-$VER-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp README.md README.ru.md CHANGELOG.md LICENSE "dist/$NAME/" 2>/dev/null || true
          if [ -f "target/${{ matrix.target }}/release/microform.exe" ]; then
            cp "target/${{ matrix.target }}/release/microform.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/microform" "dist/$NAME/"
          fi
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell -Command "Compress-Archive -Path '$NAME' -DestinationPath '$NAME.zip' -Force"
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

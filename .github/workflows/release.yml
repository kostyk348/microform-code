name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27d
          add-to-path: true
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the Rust core as a JNI library (3 ABIs)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk --platform 26 -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o android/app/src/main/jniLibs \
            build --release --features jni --lib
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build and sign the APK
        run: |
          keytool -genkeypair -v -keystore ci.keystore.jks \
            -storepass microform-ci -keypass microform-ci -alias microform \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Microform Code, O=kostyk348"
          gradle -p android \
            -PmfKeystore="$PWD/ci.keystore.jks" -PmfStorePass=microform-ci \
            -PmfKeyPass=microform-ci -PmfAlias=microform \
            assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk \
             "microform-${GITHUB_REF_NAME#v}.apk"
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: microform-*.apk

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Add Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27d
          add-to-path: true
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk --platform 24 -t arm64-v8a -t armeabi-v7a -t x86_64 build --release
      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          declare -A ABI=(
            [aarch64-linux-android]=arm64-v8a
            [armv7-linux-androideabi]=armeabi-v7a
            [x86_64-linux-android]=x86_64
          )
          for t in "${!ABI[@]}"; do
            NAME="microform-$VER-android-${ABI[$t]}"
            mkdir -p "dist/$NAME"
            cp README.md README.ru.md CHANGELOG.md LICENSE "dist/$NAME/" 2>/dev/null || true
            cp "target/$t/release/microform" "dist/$NAME/"
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          done
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NAME="microform-$VER-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp README.md README.ru.md CHANGELOG.md LICENSE "dist/$NAME/" 2>/dev/null || true
          if [ -f "target/${{ matrix.target }}/release/microform.exe" ]; then
            cp "target/${{ matrix.target }}/release/microform.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/microform" "dist/$NAME/"
          fi
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell -Command "Compress-Archive -Path '$NAME' -DestinationPath '$NAME.zip' -Force"
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

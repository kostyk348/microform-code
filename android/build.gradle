// Root build file. Native decoding/encoding comes from libmicroform.so
// (the Rust core, built with cargo-ndk into app/src/main/jniLibs) — this
// project only wires UI + CameraX around it.
plugins {
    id 'com.android.application' version '8.6.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.25' apply false
}

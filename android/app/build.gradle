plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kostyk348.microform'
    compileSdk 34

    defaultConfig {
        applicationId "com.kostyk348.microform"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.2.0"
    }

    // CI signs the release APK with a throwaway keystore passed via
    // -PmfKeystore/-PmfStorePass/-PmfKeyPass/-PmfAlias; local builds fall
    // back to the debug key so `gradle assembleDebug` just works.
    signingConfigs {
        ci {
            if (project.hasProperty('mfKeystore')) {
                storeFile file(project.property('mfKeystore'))
                storePassword project.property('mfStorePass')
                keyAlias project.property('mfAlias')
                keyPassword project.property('mfKeyPass')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig project.hasProperty('mfKeystore') ? signingConfigs.ci : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
